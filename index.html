*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f7;--card:#fff;--accent:#e94560;--accent2:#ff6b6b;--gold:#d4a843;--blue:#6c5ce7;--text:#1d1d1f;--muted:#86868b;--radius:14px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;padding:16px;min-height:100vh}
.container{max-width:960px;margin:0 auto}
header{text-align:center;padding:32px 16px 12px}
header h1{font-size:1.6em;font-weight:700;background:linear-gradient(135deg,#1d1d1f,#e94560,#d4a843);-webkit-background-clip:text;margin-bottom:4px}
header p{color:var(--muted);font-size:.85em}
.tab-bar{display:flex;justify-content:center;gap:8px;margin:14px 0}
.tab-btn{padding:8px 26px;border-radius:999px;border:1.5px solid #ddd;background:#fff;color:var(--muted);font-size:.88em;font-weight:500;cursor:pointer;transition:all .25s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 16px rgba(233,69,96,.25)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
.sec h2{font-size:1.05em;font-weight:600}
.sec .bc{font-size:.7em;color:var(--muted);margin-left:auto;background:#f0f0f2;padding:2px 10px;border-radius:12px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04);transition:all .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.1);border-color:rgba(233,69,96,.15)}
.cl{display:block;text-decoration:none;color:inherit}
.cr{display:flex;gap:12px;align-items:flex-start}
.ciw{flex-shrink:0;width:100px;height:100px;border-radius:12px;overflow:hidden;background:#f0f0f2;display:flex;align-items:center;justify-content:center;font-size:2em;color:#bbb}
.ciw img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ciw img{transform:scale(1.08)}
.cif{flex:1;min-width:0}
.ct{font-size:.92em;font-weight:600;line-height:1.45}
.ct .cn{font-size:.72em;color:var(--muted);font-weight:400;display:block}
.cm{font-size:.76em;color:var(--muted);margin-bottom:2px}
.ctg{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.66em;margin-top:3px;margin-right:4px;font-weight:500}
.ctg.h{background:#ffe8ec;color:#e94560}
.ctg.u{background:#fff8e1;color:#b8860b}
.ctg.l{background:#e8f5e9;color:#2e7d32}
.ctg.e{background:#fff0e0;color:#e67e22}
.pr{color:var(--gold);font-weight:600;font-size:.82em}
.pb{height:3px;background:#f0f0f2;border-radius:3px;margin-top:5px;overflow:hidden}
.pbf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px}
.p2{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:.63em;margin-top:3px;margin-right:3px;font-weight:500}
.p2.gf{background:#f0edff;color:#6c5ce7}
.p2.ks{background:#e6faf2;color:#00875a}
.p2.xwj{background:#ffe8ec;color:#e94560}
.p2.md{background:#fff8e1;color:#b8860b}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mc{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:all .2s}
.mc:hover{transform:translateY(-2px)}
.mc .mi{width:100%;height:80px;border-radius:8px;object-fit:cover;margin-bottom:4px;background:#f0f0f2}
.mc .mi img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.mc .mn{font-size:.72em;font-weight:500;line-height:1.3;color:var(--text)}
.mc .mm{font-size:.63em;color:var(--muted);margin-top:2px}
.mc a{color:inherit;text-decoration:none;display:block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--accent),var(--gold))}
.tli{position:relative;margin-bottom:10px}
.tli::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tli .td{color:var(--accent);font-weight:600;font-size:.78em}
.tli .te{font-size:.82em;line-height:1.4}
.tli.dn{opacity:.5}
.tli.dn::before{background:var(--muted);box-shadow:0 0 0 2px var(--muted)}
.tli.td::before{background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.carousel{background:linear-gradient(135deg,#1a1a2e,#2a1a2e);border-radius:var(--radius);padding:20px;margin-bottom:10px;color:#fff;text-align:center;border:1px solid rgba(255,255,255,.06)}
.carousel .ch{font-size:.85em;color:rgba(255,255,255,.4);margin-bottom:8px}
.carousel .cc{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.carousel .citem{min-width:120px;height:80px;background:rgba(255,255,255,.06);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.75em;color:rgba(255,255,255,.3);flex-shrink:0;overflow:hidden}
.carousel .citem img{width:100%;height:100%;object-fit:cover;border-radius:10px}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.78em;line-height:1.6}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:640px){
  .cr{flex-direction:column}
  .ciw{width:100%;height:170px}
  .g3{grid-template-columns:1fr 1fr;gap:6px}
  .tab-btn{padding:6px 18px;font-size:.82em}
}
@media(max-width:380px){.g3{grid-template-columns:1fr}}
.daily-news-page{min-height:200px}
.daily{background:linear-gradient(135deg,#1a1a2e,#2a1a2e);border-radius:var(--radius);padding:16px;margin-bottom:12px;color:#fff}
.dh{font-size:.82em;color:rgba(255,255,255,.5);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dh .sub{font-size:.82em;color:rgba(255,255,255,.3);font-weight:400}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{background:rgba(255,255,255,.06);border-radius:10px;padding:10px;transition:all .2s}
.dc:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.dt{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.65em;font-weight:500;margin-bottom:4px}
.dt.d{background:#e94560;color:#fff}
.dt.s{background:#d4a843;color:#1a1a2e}
.dt.i{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3)}
.dn{font-size:.78em;font-weight:500;line-height:1.3}
.dm{font-size:.65em;color:rgba(255,255,255,.4);margin-top:2px}
.dcnt{font-size:.6em;color:rgba(255,255,255,.5);margin-top:3px}
.daily-stack .daily:first-child{border-bottom-left-radius:0;border-bottom-right-radius:0}
.daily-stack .daily:last-child{border-top-left-radius:0;border-top-right-radius:0}
.share-bar{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.share-btn,.qr-btn{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 16px;border-radius:20px;font-size:.78em;background:var(--card);border:1px solid var(--border);color:var(--text);transition:all .2s}
.share-btn:hover,.qr-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.share-btn:active,.qr-btn:active{transform:scale(.95)}
.qr-wrap{position:relative}
.qr-dropdown{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);display:none;z-index:100}
.qr-wrap.open .qr-dropdown{display:block}
.qr-dropdown #qr_canvas{width:140px;height:140px;display:flex;align-items:center;justify-content:center}
.qr-dropdown #qr_canvas img{width:140px;height:140px;border-radius:6px}
.qr-dropdown #qr_canvas canvas{width:140px;height:140px;border-radius:6px}
.qr-label{text-align:center;font-size:.68em;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:8px;font-size:.82em;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>

function gi(nm){
  if(!nm)return '';
  var k='im_'+nm.replace(/ /g,'_').replace(/:/g,'').replace(/·/g,'').replace(/！/g,'').replace(/？/g,'');
  return window[k]||'';
}
function dt(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;var d=new Date(s);return isNaN(d.getTime())?null:d}
function dd(a,b){return Math.round((b-a)/86400000)}
function cds(t,n){if(!t)return'';var d=t-n;if(d<=0)return'已开始';var x=Math.floor(d/86400000),h=Math.floor((d%86400000)/3600000);return x>0?x+'天'+h+'小时':h+'小时'}
function tdy(d){var n=new Date();return d&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function rc(it){
  var im='',uv=gi(it.n);
  if(uv){im='<img src="'+uv+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'}
  else if(it.i){im='<img src="'+it.i+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'}
  var bt='',bx='';
  if(it.ta)it.ta.forEach(function(c,j){bt+='<span class="ctg '+c+'">'+(it.tl[j]||'')+'</span>'});
  if(it.p)bx+='<span class="p2 '+it.p+'">'+it.pl+'</span>';
  if(it.p2)bx+='<span class="p2 '+it.p2+'">'+it.pl2+'</span>';
  var n=new Date(),cd='',ed=pd(it.ed),sd=pd(it.sd?(it.sd.includes('T')?it.sd.replace('T',' '):it.sd):null);
  if(ed&&ed>n){var d2=dd(n,ed);cd='<span style="color:'+(d2<=1?'var(--accent2)':'var(--muted)')+';font-size:.75em;font-weight:'+(d2<=1?'600':'400')+'">⏰ 剩'+cds(ed,n)+'</span>'}
  if(sd&&sd>n)cd='<span style="color:var(--gold);font-weight:600;font-size:.75em">🔥 '+cds(sd,n)+'后开售</span>';
  var pb=it.pg?'<div class="pb"><div class="pbf" style="width:'+Math.min(it.pg,100)+'%"></div></div>':'';
  return '<a class="cl" href="'+it.l+'" target="_blank"><div class="card"><div class="cr"><div class="ciw">'+im+'</div><div class="cif"><div class="ct">'+it.t+'</div><div class="cm">'+it.m+'</div><div>'+bx+' '+bt+'</div>'+(it.m2?'<div class="cm" style="margin-top:2px">'+it.m2+'</div>':'')+(it.pr?'<div class="pr" style="margin-top:2px">'+it.pr+'</div>':'')+cd+pb+'</div></div></div></a>';
}
function rp(items){
  var h='<div class="g3">';
  items.forEach(function(p){
    var im='';
    if(p.hi&&gi(p.ni)){im='<img src="'+gi(p.ni)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'}
    h+='<div class="mc"><a href="'+p.l+'" target="_blank"><div class="mi">'+im+'</div><div class="mn">'+p.n+'</div><div class="mm">'+p.m+'</div></a></div>';
  });
  return h+'</div>';
}
function rtl(events){
  var n=dt(),h='<div class="tl">';
  events.forEach(function(e){
    var cls=e.d<n?'tli dn':e.d===n?'tli td':'tli';
    var lb=e.d===n?'📅 今天':e.d<n?'📅 '+e.d+' ✅':'📅 '+e.d;
    h+='<div class="'+cls+'"><div class="td">'+lb+'</div><div class="te">'+e.e+'</div></div>';
  });
  return h+'</div>';
}
function renderTab(id,items,pp,te,lb){
  var n=new Date(),td=dt();
  var todayEnd=[],nowFunding=[],comingSoon=[];
  items.forEach(function(it){
    var ed=pd(it.ed),sd=pd(it.sd?(it.sd.includes('T')?it.sd.replace('T',' '):it.sd):null);
    if(ed&&tdy(ed)){todayEnd.push(it);return}
    if(it.ta&&it.ta.indexOf('l')>=0&&(!ed||ed>n)){nowFunding.push(it);return}
    if(sd&&sd>n){comingSoon.push(it)}
  });
  todayEnd.sort(function(a,b){return(pd(a.ed)||0)-(pd(b.ed)||0)});
  nowFunding.sort(function(a,b){var ea=pd(a.ed)?pd(a.ed).getTime():9e12,eb=pd(b.ed)?pd(b.ed).getTime():9e12;return ea-eb});
  comingSoon.sort(function(a,b){return(pd(a.sd)||0)-(pd(b.sd)||0)});
  
  var h=buildDaily(items,lb,td);
  if(todayEnd.length>0)h+='<div class="sec"><span>⏰</span><h2>今天截止</h2><span class="bc">倒计时</span></div>'+todayEnd.map(rc).join('');
  h+='<div class="sec"><span>🎯</span><h2>正在众筹</h2><span class="bc">'+nowFunding.length+'个项目</span></div>';
  nowFunding.forEach(function(it){
    var ed=pd(it.ed);
    if(ed){var d2=dd(n,ed);if(d2<=3&&d2>=0){it.ta=it.ta||[];it.tl=it.tl||[];it.ta.push('e');it.tl.push('⚠️ 剩'+d2+'天')}}
  });
  h+=nowFunding.map(rc).join('');
  if(comingSoon.length>0)h+='<div class="sec"><span>🔥</span><h2>即将上线</h2></div>'+comingSoon.map(rc).join('');
  if(id==='td'){
    h+='<div class="carousel"><div class="ch">🏆 编辑推荐 · 轮播广告</div><div class="cc">'+
      '<div class="citem"><img src="https://i.zhuoyou.com/uploads/202605/6551778637792260513.jpg" alt="" loading="lazy" onerror="this.innerHTML=\'马拉开波海盗\'"></div>'+
      '<div class="citem"><img src="https://imgcdn.gamefound.com/og-image-fb/projects/8524/4229df90-5f26-4bc3-8518-578c936ad717.jpg" alt="" loading="lazy" onerror="this.innerHTML=\'Nemesis Legacy\'"></div>'+
      '<div class="citem"><img src="https://imgcdn.gamefound.com/og-image-fb/projects/8525/7af1839e-5f94-44ed-af70-cafb70aaf66d.png" alt="" loading="lazy" onerror="this.innerHTML=\'Concordia SE\'"></div>'+
      '<div class="citem"><img src="https://imgcdn.gamefound.com/og-image-fb/projects/5382/cadf17ee-f7fc-40b3-b1cb-a765d275e25e.jpg" alt="" loading="lazy" onerror="this.innerHTML=\'Dead Harvest\'"></div>'+
      '</div></div>';
  }
  h+='<div class="sec"><span>📋</span><h2>预告项目</h2><span class="bc">共'+pp.length+'个</span></div>'+rp(pp);
  h+='<div class="sec"><span>⏳</span><h2>关键时间节点</h2></div>'+rtl(te);
  document.getElementById(id).innerHTML=h;
}

function rn(){
  var td=dt();
  var h='<div class="sec"><span>📰</span><h2>每日资讯 · 汇总</h2><span class="bc">'+td+'</span></div><div class="daily-stack">';
  h+=buildDaily([].concat(DL).concat(DU),'🇨🇳 国内',td);
  h+=buildDaily([].concat(OL).concat(OU),'🌍 海外',td);
  h+='</div>';
  document.getElementById('tn_content').innerHTML=h;
}

function buildDaily(items,lb,td){
  var n=new Date(),dailyNews=[];
  items.forEach(function(it){
    var ed=pd(it.ed),sd=pd(it.sd?(it.sd.includes('T')?it.sd.replace('T',' '):it.sd):null);
    if(ed&&tdy(ed)){dailyNews.push({tag:'d',tt:'⏰ 今日截止',nm:(it.t||it.n).replace(/<[^>]*>/g,'').substring(0,24),meta:ed.getHours()+':'+String(ed.getMinutes()).padStart(2,'0')+'截止',cnt:'⚠️ 最后机会！'});return}
    if(sd&&sd>n&&sd<new Date(n.getTime()+86400000*7)){dailyNews.push({tag:'s',tt:'🔥 即将上线',nm:(it.t||it.n).replace(/<[^>]*>/g,'').substring(0,24),meta:Math.round((sd-n)/86400000)+'天后',cnt:cds(sd,n)+'后开售'})}
  });
  var h='<div class="daily"><div class="dh">📰 每日资讯 <span class="sub">'+lb+' · '+td+'</span></div><div class="dg">';
  dailyNews.slice(0,4).forEach(function(d){h+='<div class="dc"><span class="dt '+d.tag+'">'+d.tt+'</span><div class="dn">'+d.nm+'</div><div class="dm">'+d.meta+'</div><div class="dcnt">'+d.cnt+'</div></div>'});
  for(var i=dailyNews.length;i<4;i++){h+='<div class="dc" style="opacity:.3"><span class="dt i">📢</span><div class="dn">广告位 #'+(i+1)+'</div><div class="dm">推荐轮播</div><div class="dcnt" style="color:rgba(255,255,255,.2)">——</div></div>'}
  return h+'</div></div>';
}
