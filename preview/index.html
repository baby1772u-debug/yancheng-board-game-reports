<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="爱玩桌游club 自动整理新物集、摩点、Kickstarter、Gamefound 的桌游众筹动态。">
<meta name="theme-color" content="#f5f5f7">
<link rel="canonical" href="https://aiwanlands.com/">
<meta property="og:title" content="爱玩桌游 众筹资讯">
<meta property="og:description" content="每日整理国内外桌游众筹项目、开售提醒和关键时间节点。">
<meta property="og:url" content="https://aiwanlands.com/">
<meta property="og:type" content="website">
<title>🎲 爱玩桌游 众筹资讯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f7;--card:#fff;--accent:#e94560;--accent2:#ff6b6b;--gold:#d4a843;--blue:#6c5ce7;--text:#1d1d1f;--muted:#86868b;--border:rgba(0,0,0,.08);--radius:14px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;padding:16px;min-height:100vh;line-height:1.5}
button{font:inherit}
.container{max-width:960px;margin:0 auto}
header{text-align:center;padding:26px 16px 12px}
header h1{font-size:1.6em;font-weight:800;color:var(--text);background:none;margin-bottom:4px;letter-spacing:0}
header p{color:var(--muted);font-size:.85em}
.search-wrap{position:relative;max-width:620px;margin:16px auto 4px;display:flex;gap:8px;align-items:center;transition:max-width .28s ease,gap .28s ease}
.search-input{width:100%;height:42px;border:1px solid var(--border);border-radius:22px;background:#fff;padding:0 44px 0 18px;color:var(--text);box-shadow:0 4px 18px rgba(0,0,0,.05);outline:none;transition:border-color .2s,box-shadow .2s,border-radius .28s ease}
.search-input:focus{border-color:rgba(233,69,96,.45);box-shadow:0 6px 24px rgba(233,69,96,.12)}
.search-box{position:relative;flex:1;min-width:0}
.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9em}
.add-game-btn{height:42px;border-radius:22px;border:1px solid rgba(233,69,96,.2);background:#fff0f4;color:var(--accent);font-size:.82em;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 4px 18px rgba(233,69,96,.12);flex-shrink:0;padding:0 14px;transition:all .28s ease;white-space:nowrap}
.add-game-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.search-wrap.add-mode{max-width:760px;gap:0}
.search-wrap.add-mode .search-input{border-color:rgba(233,69,96,.55);border-top-right-radius:0;border-bottom-right-radius:0;box-shadow:0 8px 28px rgba(233,69,96,.16)}
.search-wrap.add-mode .add-game-btn{background:var(--accent);border-color:var(--accent);color:#fff;border-top-left-radius:0;border-bottom-left-radius:0;padding:0 18px}
.search-results{position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.12);overflow:hidden;z-index:50;display:none;text-align:left}
.search-results.open{display:block}
.search-result{width:100%;border:0;background:#fff;color:var(--text);padding:10px 14px;text-align:left;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.05)}
.search-result:last-child{border-bottom:0}
.search-result:hover,.search-result:focus-visible{background:#fff4f6;outline:none}
.search-result strong{display:block;font-size:.84em}
.search-result span{display:block;color:var(--muted);font-size:.72em;margin-top:2px}
.tab-bar{display:flex;justify-content:center;gap:8px;margin:14px 0}
.tab-btn{padding:8px 26px;border-radius:999px;border:1.5px solid #ddd;background:#fff;color:var(--muted);font-size:.88em;font-weight:500;cursor:pointer;transition:all .25s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 16px rgba(233,69,96,.25)}
.tab-btn:focus-visible,.share-btn:focus-visible,.qr-btn:focus-visible,.add-game-btn:focus-visible,.feedback-input:focus-visible,.feedback-textarea:focus-visible,.modal-close:focus-visible,.feedback-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
.sec h2{font-size:1.05em;font-weight:600}
.sec .bc{font-size:.7em;color:var(--muted);margin-left:auto;background:#f0f0f2;padding:2px 10px;border-radius:12px}
.card{background:var(--card);border-radius:var(--radius);padding:0;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s,border-color .2s;contain:layout paint;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.1);border-color:rgba(233,69,96,.15)}
.cl{display:block;text-decoration:none;color:inherit}
.cr{display:flex;gap:14px;align-items:flex-start;width:100%;padding:12px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.ciw{flex-shrink:0;width:220px;height:auto;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#f0f0f2;display:flex;align-items:center;justify-content:center;font-size:2em;color:#bbb}
.ciw img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .4s}
.card:hover .ciw img{transform:scale(1.08)}
.card.funding-card .cr{display:block;padding:0}
.card.funding-card .ciw{width:100%;min-width:0;border-radius:0;aspect-ratio:2.55/1;margin:0}
.card.funding-card .ciw img{object-fit:cover;object-position:center;background:#f0f0f2}
.card.funding-card .cif{padding:10px 14px 14px}
.card.upcoming-card .ciw,.card.ended-card .ciw{width:132px;aspect-ratio:1/1;border-radius:12px}
.card.upcoming-card .ciw img,.card.ended-card .ciw img{object-fit:cover;object-position:center}
.card.upcoming-card .cr,.card.ended-card .cr{gap:12px}
.cif{flex:1;min-width:0}
.ct{font-size:1.06em;font-weight:600;line-height:1.43}
.ct .cn{font-size:.72em;color:var(--muted);font-weight:400;display:inline}
.ct .title-tail{font-size:.86em;color:var(--muted);font-weight:500}
.cm{font-size:.76em;color:var(--muted);margin-bottom:2px}
.ctg{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.66em;margin-top:3px;margin-right:4px;font-weight:500}
.ctg.h{background:#ffe8ec;color:#e94560}
.ctg.u{background:#fff8e1;color:#b8860b}
.ctg.l{background:#e8f5e9;color:#2e7d32}
.ctg.e{background:#fff0e0;color:#e67e22}
.pr{color:var(--gold);font-weight:600;font-size:.82em}
.progress-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.pb{height:5px;background:#f0f0f2;border-radius:3px;overflow:hidden;flex:1;min-width:70px}
.pbf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px}
.progress-text{font-size:.68em;color:var(--muted);white-space:nowrap}
.p2{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:.63em;margin-top:3px;margin-right:3px;font-weight:500}
.p2.gf{background:#f0edff;color:#6c5ce7}
.p2.ks{background:#e6faf2;color:#00875a}
.p2.xwj{background:#ffe8ec;color:#e94560}
.p2.md{background:#fff8e1;color:#b8860b}
.today-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;background:#e94560;color:#fff;font-size:.64em;font-weight:600;margin-left:4px}
.tier-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tier-pill{display:inline-flex;align-items:center;max-width:100%;padding:2px 8px;border-radius:999px;background:#fff8e1;color:#b8860b;font-size:.66em;font-weight:700;white-space:nowrap}
.card-detail{display:none;padding:0 14px 14px;border-top:1px solid rgba(0,0,0,.06);background:linear-gradient(180deg,#fff,#fafafa)}
.card.open .card-detail{display:block}
.detail-copy{font-size:.82em;color:#3a3a3c;line-height:1.65;padding-top:10px}
.detail-link{display:inline-flex;color:var(--accent);font-size:.78em;text-decoration:none;font-weight:600}
.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;min-height:30px}
.card-title-line{display:flex;align-items:center;gap:8px;min-width:0}
.card-title-line .title-main{min-width:0;flex:1}
.heat-badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#fff4f6;color:var(--accent);font-size:.64em;font-weight:700;white-space:nowrap}
.engagement-row{display:flex;align-items:center;gap:7px;opacity:.48;transition:opacity .2s}
.card-detail:hover .engagement-row{opacity:.9}
.vote-btn{width:28px;height:28px;border:0;border-radius:0;background:transparent;color:var(--accent);padding:0;font-size:18px;line-height:1;cursor:pointer;transition:transform .18s ease,opacity .18s ease,filter .18s ease;box-shadow:none;filter:saturate(.75);transform-origin:center}
.vote-btn:hover{opacity:1;transform:translateY(-1px) scale(1.12);filter:saturate(1.05)}
.vote-btn:active{transform:scale(.82)}
.vote-btn.active{opacity:1;filter:saturate(1.15);animation:votePop .34s ease}
.vote-btn.down{color:#6c5ce7}
.vote-btn.down:hover,.vote-btn.down.active{color:#6c5ce7}
@keyframes votePop{0%{transform:scale(.75)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.rules-slot{margin-top:10px;padding:10px;border:1px dashed rgba(0,0,0,.12);border-radius:10px;background:#fff;color:var(--muted);font-size:.76em}
.rules-slot a{color:var(--accent);text-decoration:none;font-weight:600}
.section-tools{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;flex-wrap:wrap}
.sort-btn{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:.72em;cursor:pointer}
.sort-btn.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.more-btn{width:100%;border:1px dashed rgba(233,69,96,.35);background:#fff;color:var(--accent);border-radius:12px;padding:9px 12px;margin:4px 0 10px;cursor:pointer;font-size:.82em;font-weight:600}
.highlight-card{animation:focusFlash 1.4s ease}
@keyframes focusFlash{0%,100%{box-shadow:0 2px 12px rgba(0,0,0,.06)}30%{box-shadow:0 0 0 4px rgba(233,69,96,.22),0 8px 30px rgba(0,0,0,.12)}}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mc{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .2s;contain:layout paint}
.mc:hover{transform:translateY(-2px)}
.mc .mi{width:100%;height:80px;border-radius:8px;object-fit:cover;margin-bottom:4px;background:#f0f0f2}
.mc .mi img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.mc .mn{font-size:.72em;font-weight:500;line-height:1.3;color:var(--text)}
.mc .mm{font-size:.63em;color:var(--muted);margin-top:2px}
.mc .preview-people{display:block;color:#86868b;font-weight:600;line-height:1.35;margin-top:3px}
.mc a{color:inherit;text-decoration:none;display:block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--accent),var(--gold))}
.tli{position:relative;margin-bottom:10px}
.tli::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tli .td{color:var(--accent);font-weight:600;font-size:.78em}
.tli .te{font-size:.82em;line-height:1.4}
.tli.dn{opacity:.5}
.tli.dn::before{background:var(--muted);box-shadow:0 0 0 2px var(--muted)}
.tli.td::before{background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.78em;line-height:1.6}
footer a{color:var(--accent);text-decoration:none}
.feedback-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.feedback-input,.feedback-textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:#fafafa;color:var(--text);padding:9px 10px;font:inherit;font-size:.84em;outline:none}
.feedback-textarea{min-height:74px;resize:vertical}
.feedback-submit{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 16px;cursor:pointer;font-weight:600}
.feedback-link{border:0;background:transparent;color:var(--accent);cursor:pointer;font:inherit;text-decoration:none}
.footer-qr{margin:16px auto 0;width:156px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.footer-qr #qr_canvas{width:136px;height:136px;margin:auto;display:flex;align-items:center;justify-content:center}
.footer-qr #qr_canvas canvas,.footer-qr #qr_canvas img{width:136px;height:136px;border-radius:6px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-backdrop.open{display:flex}
.modal-card{width:min(520px,100%);max-height:min(82vh,680px);overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-head h2{font-size:1.02em}
.modal-close{min-width:32px;height:32px;border-radius:16px;border:1px solid var(--border);background:#fff;cursor:pointer;padding:0 10px}
.share-modal-card{width:min(560px,100%);max-height:min(88vh,760px);overflow:auto;padding:14px}
.share-preview-box{border-radius:12px;overflow:hidden;background:#f5f5f7;border:1px solid var(--border)}
.share-preview-box img{display:block;width:100%;height:auto}
.share-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.share-modal-actions button,.share-modal-actions a{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:6px 12px;font-size:12px;text-decoration:none;cursor:pointer}
.share-modal-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.share-hint{font-size:12px;color:var(--muted);margin:4px 0 10px}
.form-grid{display:grid;gap:9px}
.form-grid label{font-size:.76em;color:var(--muted);display:grid;gap:4px;text-align:left}
@media(max-width:640px){
  .cr{flex-direction:row;gap:8px}
  .ciw{width:132px;flex-shrink:0;border-radius:10px}
  .card.funding-card .ciw{width:100%;min-width:0}
  .ct{font-size:.96em}
  .ct .cn{font-size:.68em}
  .cm{font-size:.7em}
  .pr{font-size:.76em}
  .g3{grid-template-columns:1fr 1fr;gap:6px}
  .mc .mi{height:70px}
  .mc .mn{font-size:.68em}
  .mc .mm{font-size:.6em}
  .tab-btn{padding:6px 18px;font-size:.82em}
  .tab-bar{flex-wrap:wrap}
  header h1{font-size:1.35em}
  header p{font-size:.78em}
  .sec h2{font-size:.95em}
  .sec .bc{font-size:.65em}
  .tli .td{font-size:.72em}
  .tli .te{font-size:.76em}
  .dciw{height:auto;aspect-ratio:16/9}
  .dct{font-size:.7em;padding:4px 6px 1px}
  .dcm{font-size:.58em;padding:0 6px 6px}
  .dciw-badge{font-size:.55em}
  .daily{padding:12px}
  .daily-cards{grid-template-columns:1fr;gap:8px}
  .dh{font-size:.76em}
  .feedback-row{grid-template-columns:1fr}
  .feedback-submit{height:38px}
  body{padding:10px}
}
@media(max-width:420px){
  .ciw{width:124px}
  .ct{font-size:.9em}
  .g3{grid-template-columns:1fr 1fr;gap:4px}
}
@media(max-width:380px){.g3{grid-template-columns:1fr}}
.daily-news-page{min-height:200px}
.daily-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daily-card{background:rgba(255,255,255,.06);border:0;border-radius:10px;overflow:hidden;transition:all .2s;text-decoration:none;color:inherit;display:block;width:100%;text-align:left;font:inherit;cursor:pointer}
.daily-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.dciw{position:relative;width:100%;height:auto;aspect-ratio:16/9;overflow:hidden;background:#2a2a3e;display:flex;align-items:center;justify-content:center}
.dciw img{width:100%;height:100%;object-fit:cover;object-position:top}
.dciw-overlay{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.6))}
.dciw-badge{position:absolute;bottom:4px;left:6px;font-size:.6em;font-weight:600;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:4px;color:#fff;backdrop-filter:blur(2px)}
.dct{padding:6px 8px 1px;font-size:.75em;font-weight:600;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dct .dcs-inline{font-size:.78em;color:rgba(255,255,255,.64);font-weight:500}
.dcs{padding:0 8px 1px;font-size:.58em;line-height:1.2;color:rgba(255,255,255,.64);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcm{padding:0 8px 1px;font-size:.62em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcv{padding:0 8px 8px;font-size:.6em;color:rgba(255,255,255,.86);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 每日资讯在暗色背景中的样式修复 */
.daily .dct{color:#fff;font-weight:600}
.daily .dcm{color:rgba(255,255,255,.76)}
.daily-card{background:rgba(255,255,255,.08)}
.daily-card:hover{background:rgba(255,255,255,.12)}
.daily{background:linear-gradient(135deg,#1a1a2e,#2a1a2e);border-radius:var(--radius);padding:16px;margin-bottom:12px;color:#fff}
.dh{font-size:.82em;color:rgba(255,255,255,.78);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dh .sub{font-size:.82em;color:rgba(255,255,255,.58);font-weight:400}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{background:rgba(255,255,255,.06);border-radius:10px;padding:10px;transition:all .2s}
.dc:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.dt{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.65em;font-weight:500;margin-bottom:4px}
.dt.d{background:#e94560;color:#fff}
.dt.s{background:#d4a843;color:#1a1a2e}
.dt.i{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3)}
.dn{font-size:.78em;font-weight:500;line-height:1.3}
.dm{font-size:.65em;color:rgba(255,255,255,.4);margin-top:2px}
.dcnt{font-size:.6em;color:rgba(255,255,255,.5);margin-top:3px}
.daily-stack .daily:first-child{border-bottom-left-radius:0;border-bottom-right-radius:0}
.daily-stack .daily:last-child{border-top-left-radius:0;border-top-right-radius:0}
/* ===== 文字滚动榜单 ===== */
.rank-scroll-wrap{border-radius:12px;overflow:hidden;background:linear-gradient(135deg,rgba(233,69,96,.18),rgba(212,168,67,.1));cursor:pointer}
.rank-scroll-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:9px 10px 4px;color:rgba(255,255,255,.9)}
.rank-scroll-title{display:flex;align-items:center;gap:4px;min-width:0;font-size:12px;font-weight:700;white-space:nowrap}
.rank-scroll-head .rank-toggle{display:inline-flex;gap:3px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px;white-space:nowrap}
.rank-scroll-head .rank-toggle button{border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.65);font-size:10px;line-height:1;padding:4px 8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.rank-scroll-head .rank-toggle button.active{background:#fff;color:#1d1d1f}
.rank-scroll-inner{display:grid;gap:4px;max-height:132px;overflow-y:auto;overflow-x:hidden;padding:3px 10px 10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}
.rank-scroll-inner::-webkit-scrollbar{width:3px}
.rank-scroll-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px}
.rank-scroll-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 8px;align-items:center;width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:transparent;color:inherit;text-align:left;font:inherit;cursor:default;padding:4px 0 7px}
.rank-scroll-item:last-child{border-bottom:0}

.growth-title{font-size:12px;font-weight:700;margin:4px 0 6px}

.qr-dropdown{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);display:none;z-index:100}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:8px;font-size:.82em;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}

var _gfOverseasFunding=[], _gfOverseasUpcoming=[];

function loadOverseasTab(){
  var el=document.getElementById('to');
  el.innerHTML='<div class="sec"><span>🌍</span><h2>正在从GF API获取项目数据...</h2></div><div style="text-align:center;padding:40px;color:#999">请稍候</div>';

  // 检查缓存（1 分钟内有效）
  var now=Date.now();
  if(_gfCache.data&&(now-_gfCache.ts)<60000){
    renderOverseasFromApi(_gfCache.data);
    return;
  }

  var xhr=new XMLHttpRequest();
  xhr.open('GET','/api/gf-active-projects',true);
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var resp=JSON.parse(xhr.responseText);
        if(resp.ok&&resp.projects){
          _gfCache={data:resp.projects,ts:Date.now()};
          renderOverseasFromApi(resp.projects);
        }else{
          el.innerHTML='<div class="sec"><span>⚠️</span><h2>API返回数据异常</h2></div><div style="text-align:center;padding:40px;color:#999">'+escHtml(JSON.stringify(resp))+'</div><div style="text-align:center"><button type="button" class="sort-btn active" onclick="loadOverseasTab()">重试</button></div>';
        }
      }catch(e){
        el.innerHTML='<div class="sec"><span>⚠️</span><h2>数据解析出错</h2></div><div style="text-align:center;padding:40px;color:#999">'+escHtml(e.message)+'</div><div style="text-align:center"><button type="button" class="sort-btn active" onclick="loadOverseasTab()">重试</button></div>';
      }
    }else{
      el.innerHTML='<div class="sec"><span>⚠️</span><h2>API请求失败</h2></div><div style="text-align:center;padding:40px;color:#999">HTTP '+xhr.status+'</div><div style="text-align:center"><button type="button" class="sort-btn active" onclick="loadOverseasTab()">重试</button></div>';
    }
  };
  xhr.onerror=function(){
    // API不可用时回退到硬编码数据
    el.innerHTML='<div class="sec"><span>⚠️</span><h2>API不可用，使用本地数据</h2></div>';
    renderMarketTab('to',[].concat(OL).concat(OU),OP,[],OTE,'🌍 海外');
  };
  xhr.send();
}

function gfApiCardToItem(card){
  // 将GF API返回的卡片数据转换为前端rc()函数可识别的项目对象
  // 后端已处理状态分类，直接使用card中的 ta/tl/sd/ed
  var n=new Date();
  var ed=card.ed?pd(card.ed):null;
  var sd=card.sd?pd(card.sd):null;
  
  // 构建metaline
  var metaParts=[card.creator||'','GF'];
  if(ed&&ed>n){
    var days=Math.round((ed-n)/86400000);
    metaParts.push((days<=1?'⚠️ ':'')+'剩'+days+'天');
  }else if(ed&&ed<=n){
    metaParts.push('已结束');
  }else if(!sd||sd>n){
    metaParts.push('预告');
  }
  
  // 使用后端返回的 tl 和 ta，或者自己构建
  var tl=[].concat(card.tl||[]);
  var ta=[].concat(card.ta||[]);
  
  // 如果没有标签，根据状态生成
  if(!tl.length){
    if(ed&&ed<=n){
      tl.push('✅ 已结束');
    }else if(!sd||sd>n){
      tl.push('即将上线');
    }else{
      tl.push('众筹中');
      if(card.amount>0){
        var sym={'USD':'$','EUR':'€','GBP':'£','PLN':'zł','CZK':'Kč','SEK':'kr','NOK':'kr','DKK':'kr'};
        var s=sym[card.currency]||card.currency+' ';
        tl.push('🔥 '+s+Number(card.amount).toLocaleString('zh-CN'));
      }
    }
  }
  if(!ta.length){
    if(ed&&ed<=n){
      // 已结束
    }else if(!sd||sd>n){
      ta.push('u');
    }else{
      ta.push('l');
      ta.push('m');
    }
  }
  
  // 封面图：API有图片链接，传给rc()函数用it.i显示
  var image=card.image||'';
  
  // m2: 描述/子标题，后端返回或自己构造
  var m2=card.m2||'';
  if(!m2&&card.followers) m2=card.followers+'人关注';
  
  return {
    n: card.n,
    t: '<span class="en">'+escHtml(card.name)+'</span>',
    m: metaParts.join(' · '),
    p: 'gf',
    pl: '🎮 GF',
    ta: ta,
    tl: tl,
    m2: m2,
    pg: 100,
    l: card.url,
    sd: card.sd,
    ed: card.ed,
    i: image,       // 封面URL，rc()会检查it.i
    _api_source: 'gf-api',
    _amount: card.amount,
    _backers: card.backers,
  };
}

function renderOverseasFromApi(projects){
  // 转换API项目为前端卡片格式
  var items=projects.map(gfApiCardToItem);
  var n=new Date();
  
  // 分类：正在众筹 / 即将上线 / 已结束 / 预告
  var funding=[], upcoming=[], endedItems=[], previewItems=[];
  items.forEach(function(it){
    var ed=pd(it.ed);
    var sd=pd(it.sd);
    if(ed&&ed<=n){
      endedItems.push(it);
    }else if(sd&&sd<=n){
      funding.push(it);
    }else if(sd&&sd>n){
      upcoming.push(it);
    }else{
      previewItems.push(it);
    }
  });
  
  // 合并本地OP中的预告项目（排除已结束的）
  var opPreview=OP.filter(function(it){
    return !isEndedProject(it,n) && !it.sd;
  });
  previewItems=[].concat(previewItems,opPreview);
  
  // 合并本地已结束项目
  var opEnded=OP.filter(function(it){return isEndedProject(it,n);});
  endedItems=[].concat(endedItems,opEnded);
  
  // 处理硬编码OL中混入的已结束项目（如已过期的Archvillain/Caverns等）
  // 如果API数据已经覆盖了这些项目，就忽略硬编码的
  var apiNames={};
  items.forEach(function(it){apiNames[it.n]=true;});
  OL.forEach(function(it){
    var ed=pd(it.ed);
    if(ed&&ed<=n && !apiNames[it.n]){
      endedItems.push(it);
    }
  });
  
  // 按金额排序
  funding.sort(function(a,b){return (b._amount||0)-(a._amount||0)});
  
  // 构建关键时间节点
  var events=[];
  items.concat(OP).forEach(function(it){
    if(it.sd)events.push({d:it.sd,e:escHtml(stripHtml(it.t))+' 上线'});
    if(it.ed)events.push({d:it.ed,e:escHtml(stripHtml(it.t))+' 截止'});
  });
  var seen={};
  events=events.filter(function(e){
    var k=e.d+e.e;
    if(seen[k])return false;
    seen[k]=true;
    return true;
  }).sort(function(a,b){return String(a.d).localeCompare(String(b.d))});
  
  // 更新全局变量（供每日资讯）
  _gfOverseasFunding=funding;
  _gfOverseasUpcoming=upcoming;
  _gfOverseasEnded=endedItems;
  _gfOverseasPreview=previewItems;

  // 用renderMarketTab但传递分类后的数据
  var h='';
  if(funding.length>0)h+=renderListSection('to-active','🎯','正在众筹 · GF',funding,5);
  if(upcoming.length>0)h+=renderListSection('to-upcoming','🔥','即将上线',upcoming,3);
  if(endedItems.length>0)h+=renderListSection('to-ended','✅','已结束',endedItems,3);
  if(previewItems.length>0)h+=renderPreviewSection('to-preview',previewItems);
  h+='<div class=\"sec\"><span>⏳</span><h2>关键时间节点</h2></div>'+rtl(events);
  document.getElementById('to').innerHTML=h;
}

function gi(nm){
  if(!nm)return '';
  var raw=String(nm);
  var names=[
    raw,
    raw.replace(/-/g,'_'),
    raw.replace(/[^\w\u4e00-\u9fff]+/g,'_'),
    raw.replace(/[^\w\u4e00-\u9fff]+/g,'_').replace(/^_+|_+$/g,'')

function rp(items){

function previewNameHtml(p){

function previewMetaParts(p){
  var raw=cleanDisplayName(p.m||''),parts=raw.split('·').map(function(x){return x.trim()}).filter(Boolean);
  var people=[],platform=[];
  parts.forEach(function(x){
    if(/[\d,.]+\s*(万|k|K)?\s*人?(预约|关注|感兴趣)/.test(x)||/(预约|关注|感兴趣)/.test(x))people.push(x);

function uniqueItems(items){
  var seen={},out=[];
  (items||[]).forEach(function(it){
    var k=keyOf(it);
    if(seen[k])return;

    out.push(it);
  });
  return out;
}
function splitMarketItems(items,ended){
  var n=new Date(),todayEnd=[],nowFunding=[],comingSoon=[],endedItems=[],previewItems=[];
  uniqueItems([].concat(items||[],ended||[])).forEach(function(it){
    var ed=pd(it.ed);
    if(ed&&tdy(ed)){todayEnd.push(it);return}
    if(isEndedProject(it,n)){endedItems.push(it);return}
    if(isFunding(it,n)){nowFunding.push(it);return}
    if(isUpcoming(it,n)){comingSoon.push(it);return}
    if(/预告|即将上线|关注|预约/.test([it.m].concat(it.tl||[]).join(' '))||followersOf(it)>0){previewItems.push(it);return}
  });
  todayEnd.sort(function(a,b){return(pd(a.ed)||0)-(pd(b.ed)||0)});
  endedItems.sort(function(a,b){return(pd(b.ed)||0)-(pd(a.ed)||0)});
  return {todayEnd:todayEnd,nowFunding:nowFunding,comingSoon:comingSoon,endedItems:endedItems,previewItems:previewItems};
}

function buildDailyV2(funding,upcoming,ended,lb,td,n){
  var sections=[], im='';
  
  var justLaunched = funding.concat(upcoming).filter(function(it){
    var sd=startDateOf(it);
    return sd&&sd<=n;
  });
  justLaunched.sort(function(a,b){
    return startDateOf(b)-startDateOf(a);
  });
  if(justLaunched.length>0){
    var it=justLaunched[0],sd=pd(it.sd);
    var days=Math.round((n-sd)/86400000);
    var label=days===0?'今天上线':days+'天前上线';
    im=imgTag(gi(it.n),it.n);
    sections.push({title:'最近上线',kind:'funding',item:it,label:label,sub:label,img:im});
  }
  
  var comingUp = upcoming.filter(function(it){
    var sd=startDateOf(it);
    return sd&&sd>n;
  });
  comingUp.sort(function(a,b){return startDateOf(a)-startDateOf(b)});
  if(comingUp.length>0){
    var it=comingUp[0],sd=pd(it.sd);
    var d2=Math.round((sd-n)/86400000);
    var label=d2+'天后开售';
    im=imgTag(gi(it.n),it.n);
    sections.push({title:'即将上线',kind:'upcoming',item:it,label:label,sub:cds(sd,n)+'后开售',img:im});
  }
  
  var endingSoon = funding.filter(function(it){
    var ed=pd(it.ed);
    return ed&&ed>n;
  });
  endingSoon.sort(function(a,b){return pd(a.ed)-pd(b.ed)});
  if(endingSoon.length>0){
    var it=endingSoon[0],ed=pd(it.ed);
    var d2=Math.round((ed-n)/86400000);
    var label=d2===0?'今天截止':d2+'天后截止';
    im=imgTag(gi(it.n),it.n);
    sections.push({title:'即将结束',kind:'funding',item:it,label:label,sub:cds(ed,n)+'后截止',img:im});
  }

  var h='<div class="daily"><div class="dh">📰 每日资讯 <span class="sub">'+lb+' · '+td+'</span></div><div class="daily-cards">';
  sections.forEach(function(s){
    var it=s.item;
    var tab=rankKeyFromLabel(lb)==='domestic'?'d':'o';
    h+='<button type="button" class="daily-card" onclick="focusProject(\''+tab+'\',\''+escAttr(keyOf(it))+'\')"><div class="dciw">'+s.img+'<div class="dciw-overlay"></div><span class="dciw-badge">'+s.title+'</span></div><div class="dct">'+dailyTitleHtml(it)+'</div><div class="dcm">'+escHtml(s.sub)+'</div><div class="dcv">'+escHtml(dailyMetricText(it,s.kind))+'</div></button>';
  });
  h+=dailyRankCard(funding,upcoming,n,lb);
  h+='</div></div>';
  return h;
}

function rankValueText(it,mode){

function dailyMetricText(it,kind){

function dailyRankCard(funding,upcoming,n,lb){
  var key=rankKeyFromLabel(lb),mode=rankMode[key]||'amount';

  var expect=upcoming.filter(function(it){return isExpectation(it,n)});
  var pool=mode==='amount'?(live.length>=3?live:funding):live.concat(expect);
  var sorted=pool.slice().filter(function(it){
    var v=rankValue(it,mode);
    if(mode==='people')return v>0;
    return true;
  }).sort(function(a,b){return rankValue(b,mode)-rankValue(a,mode)});

  var displayCount=8;
  var topItems=sorted.slice(0,displayCount);
  var max=Math.max.apply(null,topItems.map(function(it){return rankValue(it,mode)}).concat([1]));

  function itemHtml(it,i){
    var value=rankValue(it,mode);
    var pct=Math.max(5,Math.min(100,value/max*100));
    return '<div class="rank-scroll-item"><span class="rank-scroll-no">'+(i+1)+'.</span><span class="rank-scroll-name">'+escHtml(shortTitle(it))+'</span><span class="rank-scroll-value">'+escHtml(rankValueText(it,mode))+'</span><span class="rank-scroll-bar"><span class="rank-scroll-bar-fill" style="width:'+pct+'%"></span></span></div>';
  }

  var itemsHtml=topItems.length?topItems.map(itemHtml).join(''):'<div class="rank-scroll-empty">暂无可展示项目</div>';
  return '<div id="daily_rank_'+key+'" class="rank-scroll-wrap" role="button" tabindex="0" onclick="openRankModal(\''+key+'\')" onkeydown="rankCardKey(event,\''+key+'\')"><div class="rank-scroll-head"><div class="rank-scroll-title"><span>🏆 榜单</span></div><div class="rank-toggle"><button type="button" class="'+(mode==='amount'?'active':'')+'" onclick="setRankMode(event,\''+key+'\',\'amount\')">金额</button><button type="button" class="'+(mode==='people'?'active':'')+'" onclick="setRankMode(event,\''+key+'\',\'people\')">人数</button></div></div><div class="rank-scroll-inner">'+itemsHtml+'</div></div>';
}

function rankDeltaText(it,mode){
  var d=deltaOf(it,mode==='amount'?'amount':'expect');
  return mode==='amount'?(moneyLabel(d.amount)+' · '+peopleLabel(d.people)):(d.followers?peopleLabel(d.followers):'增长待同步');
}
function growthSeries(it,mode){
  var total=Math.max(rankValue(it,mode),1);
  var start=startDateOf(it)||new Date(Date.now()-13*86400000);
  var end=endDateOf(it);
  var stop=end&&end<new Date()?end:new Date();
  var days=Math.max(7,Math.min(14,Math.ceil((stop-start)/86400000)||7));
  var d=deltaOf(it,mode==='amount'?'amount':'expect');
  var recent=mode==='amount'?(d.amount||Math.round(total*.018)):(d.followers||d.people||Math.round(total*.025));
  var values=[],base=Math.max(1,total-Math.max(recent*6,total*.18));
  for(var i=0;i<days;i++){
    var t=days===1?1:i/(days-1);
    var eased=1-Math.pow(1-t,1.7);
    var wave=Math.sin(i*1.4)*0.025*total;
    var v=Math.round(base+(total-base)*eased+wave);
    if(i===days-1)v=total;
    values.push(Math.max(1,Math.min(total,v)));
  }
  return values;
}
function growthChartHtml(it,mode){
  var vals=growthSeries(it,mode),w=320,h=132,p=16,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max===min){max=min+1}
  var pts=vals.map(function(v,i){
    var x=p+i*(w-p*2)/(vals.length-1),y=h-p-(v-min)*(h-p*2)/(max-min);
    return [Math.round(x),Math.round(y)];
  });
  var poly=pts.map(function(p){return p[0]+','+p[1]}).join(' ');
  var area=''+pts[0][0]+','+(h-p)+' '+poly+' '+pts[pts.length-1][0]+','+(h-p);
  return '<div class="growth-title">'+escHtml(cleanTitle(it)).slice(0,18)+'</div><svg class="growth-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="每日增长曲线"><polygon points="'+area+'" fill="rgba(233,69,96,.12)" stroke="none"></polygon><polyline points="'+poly+'" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>'+pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#d4a843"/>'}).join('')+'</svg><div class="growth-note">众筹期间每日增长曲线。当前用已同步数据生成趋势预览，接入每日抓取后会替换为真实每日记录。</div>';
}

  }).join('')+'</div>';
  if(allItems.length>7)h+='<button type="button" class="rank-more" onclick="toggleRankMore()">'+(rankModalState.showAll?'收起榜单':'查看更多 '+(allItems.length-7)+' 个')+'</button>';
  document.getElementById('rank_modal_body').innerHTML=h;
}

      searchIndex.push({tab:group[0],key:keyOf(it),item:it,text:(cleanTitle(it)+' '+(it.n||'')+' '+(it.m||'')+' '+(it.m2||'')).toLowerCase()});

function onSearch(q){
  var box=document.getElementById('search_results');
  q=String(q||'').trim().toLowerCase();
  if(!q){box.classList.remove('open');box.innerHTML='';return}
  if(addProjectMode&&looksLikeUrl(q)){box.classList.remove('open');box.innerHTML='';return}

function loadScriptOnce(src,globalName){
  return new Promise(function(resolve,reject){
    if(globalName&&window[globalName]){resolve();return}
    var old=document.querySelector('script[src="'+src+'"]');
    if(old){old.addEventListener('load',resolve);old.addEventListener('error',reject);return}
    var s=document.createElement('script');
    var timer=setTimeout(function(){reject(new Error('script timeout'))},8000);
    s.src=src;s.async=true;
    s.onload=function(){clearTimeout(timer);resolve()};
    s.onerror=function(){clearTimeout(timer);reject(new Error('script load failed'))};
    document.head.appendChild(s);
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function withTimeout(promise,ms,label){
  return Promise.race([
    promise,
    new Promise(function(_,reject){setTimeout(function(){reject(new Error(label||'timeout'))},ms)})
  ]);
}
function waitForShareImages(root){
  var imgs=Array.prototype.slice.call((root||document).querySelectorAll('img'));
  imgs.forEach(function(img){
    img.loading='eager';
    if(img.dataset&&img.dataset.src&&!img.getAttribute('src'))img.setAttribute('src',img.dataset.src);
  });
  return Promise.all(imgs.map(function(img){
    if(img.complete&&img.naturalWidth>0)return Promise.resolve();
    if(img.decode){
      var decoded=img.decode().catch(function(){
        return new Promise(function(resolve){
          img.addEventListener('load',resolve,{once:true});
          img.addEventListener('error',resolve,{once:true});
          setTimeout(resolve,4500);
        });
      });
      return Promise.race([
        decoded,
        new Promise(function(resolve){setTimeout(resolve,4500)})
      ]);
    }
    return new Promise(function(resolve){
      img.addEventListener('load',resolve,{once:true});
      img.addEventListener('error',resolve,{once:true});
      setTimeout(resolve,4500);
    });
  }));
}

        el.style.display=el.dataset.ssDisplay;

}
function buildScreenshotTarget(){
  var source=document.querySelector('.container')||document.body;
  var wrap=document.createElement('div');
  wrap.className='container screenshot-capture-root';
  wrap.style.position='absolute';
  wrap.style.left='-10000px';

  wrap.querySelectorAll('[hidden]').forEach(function(el){el.hidden=false});

async function captureVisibleScreen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return false;
  toast('请选择当前网页窗口进行截图');
  var stream=await navigator.mediaDevices.getDisplayMedia({
    video:{displaySurface:'browser'},
    audio:false
  });
  try{
    var video=document.createElement('video');
    video.muted=true;
    video.playsInline=true;
    video.srcObject=stream;
    await video.play();
    await new Promise(function(resolve){
      if(video.videoWidth)resolve();
      else video.onloadedmetadata=resolve;
    });
    var c=document.createElement('canvas'),ctx=c.getContext('2d');
    c.width=video.videoWidth||window.innerWidth;
    c.height=video.videoHeight||window.innerHeight;
    ctx.drawImage(video,0,0,c.width,c.height);
    showSharePreviewFromCanvas(c);
    return true;
  }finally{
    stream.getTracks().forEach(function(track){track.stop()});
  }
}
async function capturePageLongImage(){
  await loadScriptOnce('assets/html2canvas.min.js','html2canvas');
  var target=buildScreenshotTarget();
  document.body.appendChild(target);
  await waitForShareImages(target);
  hideForScreenshot(true);
  await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});
  var cssHeight=Math.max(target.scrollHeight,target.offsetHeight,document.documentElement.clientHeight);
  var scale=cssHeight>3200?1:Math.min(2,window.devicePixelRatio||1.5);
  try{
    var canvas=await withTimeout(html2canvas(target,{
      backgroundColor:'#f5f5f7',
      scale:scale,
      useCORS:true,
      allowTaint:false,
      logging:false,
      imageTimeout:8000,
      scrollX:0,
      scrollY:-window.scrollY,
      windowWidth:document.documentElement.scrollWidth,
      windowHeight:document.documentElement.scrollHeight,
      ignoreElements:function(el){
        return el.classList&&(
          el.classList.contains('modal-backdrop')||
          el.classList.contains('toast')||
          el.classList.contains('back-top')
        );
      }
    }),30000,'capture timeout');
    showSharePreviewFromCanvas(canvas);
  }finally{
    hideForScreenshot(false);
    if(target&&target.parentNode)target.parentNode.removeChild(target);
  }
}

// ===== GF 翻译功能 =====
var _gfTranslateCache={};
var _gfTranslated=false;

function translateGFDetail(){
  var btn=document.querySelector('.translate-btn');
  if(!btn)return;
  if(_gfTranslated){
    // 切换回原文
    document.querySelectorAll('.translated-text').forEach(function(el){el.classList.remove('show')});
    document.querySelectorAll('.desc-text, .info-row').forEach(function(el){el.classList.remove('translated')});
    btn.textContent='🌐 翻译';
    btn.classList.remove('translated');
    _gfTranslated=false;
    return;
  }
  
  btn.textContent='⏳ 翻译中...';
  btn.classList.add('translating');
  
  // 收集需要翻译的文本
  var texts=[];
  var descEl=document.getElementById('gf-desc-text');
  if(descEl&&descEl.textContent.trim()){
    texts.push({key:'desc',text:descEl.textContent.trim()});
  }
  var infoRows=document.querySelectorAll('#gf-detail-left .info-row');
  infoRows.forEach(function(row,idx){
    var txt=row.textContent.trim();
    if(txt&&/players|play_time|时长|人数|age|年龄|age|类别|简介/i.test(txt)){
      texts.push({key:'info_'+idx,text:txt});
    }
  });
  var tierDescEls=document.querySelectorAll('.tp-desc');
  tierDescEls.forEach(function(el,idx){
    var txt=el.textContent.trim();
    if(txt)texts.push({key:'tier_'+idx,text:txt});
  });
  
  if(!texts.length){
    btn.textContent='🌐 翻译';
    btn.classList.remove('translating');
    return;
  }
  
  // 批量翻译
  var toTranslate=texts.map(function(t){return t.text}).join('\n---\n');
  var cacheKey=toTranslate.slice(0,100);
  if(_gfTranslateCache[cacheKey]){
    applyTranslation(_gfTranslateCache[cacheKey],texts,btn);
    return;
  }
  
  translateText(toTranslate,function(translated){
    if(translated){
      _gfTranslateCache[cacheKey]=translated;
      applyTranslation(translated,texts,btn);
    }else{
      btn.textContent='🌐 翻译';
      btn.classList.remove('translated','translating');
    }
  });
}

function applyTranslation(translated,originalTexts,btn){
  var parts=translated.split('\n---\n');
  var n=document.createDocumentFragment();
  
  // 先保存原文，显示译文
  var descEl=document.getElementById('gf-desc-text');
  if(descEl&&parts[0]){
    // 保存原文到HTML的某个隐藏属性
    if(!descEl.dataset.original)descEl.dataset.original=descEl.innerHTML;
    var transId='gf-desc-trans';
    var transEl=document.getElementById(transId);
    if(!transEl){
      transEl=document.createElement('div');
      transEl.id=transId;
      transEl.className='translated-text';
      descEl.parentNode.insertBefore(transEl,descEl.nextSibling);
    }
    transEl.textContent=parts[0];
    transEl.classList.add('show');
    descEl.classList.add('translated');
  }
  
  // info rows
  var infoRowIdx=1;
  for(var i=1;i<parts.length&&infoRowIdx<originalTexts.length;i++){
    var ot=originalTexts[infoRowIdx];
    var translatedPart=parts[i];
    if(translatedPart&&ot.key.startsWith('info_')){
      var rows=document.querySelectorAll('#gf-detail-left .info-row');
      rows.forEach(function(row,ri){
        if(!row.dataset.original)row.dataset.original=row.innerHTML;
        var transId='gf-info-trans-'+ri;
        var transEl=document.getElementById(transId);
        if(!transEl){
          transEl=document.createElement('div');
          transEl.id=transId;
          transEl.className='translated-text info-trans';
          row.parentNode.insertBefore(transEl,row.nextSibling);
        }
        transEl.textContent=translatedPart;
        transEl.classList.add('show');
        row.classList.add('translated');
      });
      infoRowIdx++;
    }
  }
  
  // tier descs
  var tierIdx=0;
  var tierEls=document.querySelectorAll('.tp-desc');
  tierEls.forEach(function(el,tri){
    if(!el.dataset.original)el.dataset.original=el.textContent;
  });
  for(var i=1;i<parts.length;i++){
    var ot=originalTexts[i];
    if(ot&&ot.key.startsWith('tier_')&&tierEls[tierIdx]){
      tierEls[tierIdx].textContent=parts[i];
      tierEls[tierIdx].classList.add('translated');
      tierIdx++;
    }
  }
  
  btn.textContent='🌐 原文';
  btn.classList.remove('translating');
  btn.classList.add('translated');
  _gfTranslated=true;
}

function translateText(text,callback){
  // 使用硅基流动API翻译
  var xhr=new XMLHttpRequest();
  var body=JSON.stringify({text:text,source:'en',target:'zh'});
  xhr.open('POST','/api/translate',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var resp=JSON.parse(xhr.responseText);
        if(resp.ok&&resp.translated){
          callback(resp.translated);
          return;
        }
      }catch(e){}
    }
    // 失败时用简单词典翻译
    fallbackTranslate(text,callback);
  };
  xhr.onerror=function(){fallbackTranslate(text,callback)};
  xhr.send(body);
}

function fallbackTranslate(text,callback){
  // 简单的词典翻译，作为备选
  var dict={
    'players':'玩家人数','play time':'游戏时长','playing time':'游戏时长','age':'适合年龄',
    'category':'游戏类别','description':'游戏介绍','about':'关于','intro':'介绍',
    'pledge':'档位','tier':'档位','reward':'回报','shipping':'运费','delivery':'发货',
    'estimated delivery':'预计发货','funded':'已达标','backers':'支持者','funding':'众筹',
    'campaign':'众筹项目','Project':'项目','pledge starts':'档位起价','sold out':'已售罄',
    'limited':'限量','exclusive':'独占','add-on':'加购','all in':'全套',
    'reprint':'再版','expansion':'扩展','standalone':'独立扩展','big box':'大盒版',
    'deluxe':'豪华版','premium':'高级版','collector':'收藏版','retail':'零售版',
    'card':'卡牌','board game':'桌游','miniature':'模型','dice':'骰子',
    'fantasy':'奇幻','sci-fi':'科幻','horror':'恐怖','adventure':'冒险',
    'strategy':'策略','war':'战争','european':'德式','american':'美式',
    'cooperative':'合作','competitive':'竞争','solo':'单人','multiplayer':'多人',
    '30 min':'30分钟','60 min':'60分钟','90 min':'90分钟','120 min':'120分钟',
    '14+':'14岁以上','12+':'12岁以上','10+':'10岁以上','8+':'8岁以上',
    'age 14':'14岁以上','age 13':'13岁以上',
  };
  var result=text;
  var keys=Object.keys(dict).sort(function(a,b){return b.length-a.length});
  keys.forEach(function(k){
    var re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    result=result.replace(re,dict[k]);
  });
  callback(result);
}



function renderGFDetail(d){
  var leftEl=document.getElementById('gf-detail-left');
  var rightEl=document.getElementById('gf-detail-right');
  if(!leftEl||!rightEl)return;
  
  // 头部 + 翻译按钮
  var headerEl=document.getElementById('gf-detail-header');
  if(headerEl){
    headerEl.innerHTML='<div class="header-title-row"><h2>'+escHtml(d.project_name||d.url_name||'')+'</h2>'+
      '<button type="button" class="translate-btn" onclick="translateGFDetail()" title="翻译为中文">🌐 翻译</button></div>'+
      '<div class="sub">'+(d.creator_name?escHtml(d.creator_name):'')+'</div>';
  }
  
  // 左栏：封面+信息
  var leftHtml='';
  if(d.image_url)leftHtml+='<img class="cover" src="'+escAttr(d.image_url)+'" alt="'+escAttr(d.project_name)+'" loading="lazy">';
  leftHtml+='<div class="info-wrap">';
  if(d.players)leftHtml+='<div class="info-row"><strong>玩家人数:</strong> '+escHtml(d.players)+'</div>';
  if(d.play_time)leftHtml+='<div class="info-row"><strong>游戏时长:</strong> '+escHtml(d.play_time)+'</div>';
  if(d.age)leftHtml+='<div class="info-row"><strong>适龄:</strong> '+escHtml(d.age)+'</div>';
  if(d.category)leftHtml+='<div class="info-row"><strong>类别:</strong> '+escHtml(d.category)+'</div>';
  if(d.short_description)leftHtml+='<div class="info-row"><strong>简介:</strong> '+escHtml(d.short_description)+'</div>';
  leftHtml+='</div>';
  leftEl.innerHTML=leftHtml;
  
  // 右栏：介绍+档位+更新+评论
  var rightHtml='';
  
  // 介绍
  var desc=d.intro_summary||d.description||d.short_description||'暂无介绍';
  var descShort=desc.length>200?desc.slice(0,200)+'...':desc;
  rightHtml+='<div class="section-title">📖 游戏介绍</div>'+
    '<div class="desc-text" id="gf-desc-text">'+escHtml(descShort)+'</div>';
  if(desc.length>200){
    rightHtml+='<button type="button" class="desc-toggle" onclick="toggleGFDesc(\''+escAttr(d.url_name)+'\')">展开全文</button>';
  }
  
  // 档位 — 胶囊样式
  if(d.tiers&&d.tiers.length){
    rightHtml+='<div class="section-title">🎯 档位一览 <span style="font-weight:400;color:#888;font-size:.82em">('+d.tiers.length+'个)</span></div>';
    rightHtml+='<div class="tier-pills">';
    d.tiers.forEach(function(t){
      var priceStr=(t.currency||'€')+Number(t.price||0).toLocaleString('zh-CN');
      var backersStr=t.backers?t.backers+'人已选':'';
      var descStr=t.description||'';
      rightHtml+='<div class="tier-pill">'+
        '<span class="tp-name">'+escHtml(t.reward_name||'')+'</span>'+
        '<span class="tp-price">'+priceStr+'</span>'+
        (backersStr?'<span class="tp-backers">'+backersStr+'</span>':'')+
        (descStr?'<span class="tp-desc">'+escHtml(descStr.slice(0,80))+'</span>':'')+
        '</div>';
    });
    rightHtml+='</div>';
  }
  
  // 更新 — 在当前页展开，不弹窗
  if(d.updates&&d.updates.length){
    rightHtml+='<div class="section-title">📢 作者动态 <span style="font-weight:400;color:#888;font-size:.82em">('+d.updates.length+'条)</span></div>';
    rightHtml+='<div class="update-list">';
    d.updates.forEach(function(u,ui){
      var uid='gf-update-'+d.url_name+'-'+ui;
      rightHtml+='<div class="update-card" onclick="toggleUpdateBody(\''+uid+'\',this)">'+
        '<div class="update-header-row">'+
        '<div class="update-title">'+escHtml(u.title||'')+'</div>'+
        '<div class="update-meta">'+(u.posted_at?escHtml(u.posted_at.slice(0,10)):'')+'</div>'+
        '</div>'+
        (u.likes_count?'<div class="update-likes">❤ '+u.likes_count+'</div>':'')+
        '<div class="update-body-content" id="'+uid+'" style="display:none">'+
        renderUpdateBodyHtml(u.body_html||'')+
        '</div>'+
        '</div>';
    });
    rightHtml+='</div>';
  }
  
  // 评论
  if(d.comments&&d.comments.length){
    rightHtml+='<div class="section-title">💬 高赞评论 <span style="font-weight:400;color:#888;font-size:.82em">(Top '+Math.min(d.comments.length,3)+')</span></div>';
    rightHtml+='<div class="comment-list">';
    d.comments.slice(0,3).forEach(function(c){
      var bodyHtml=renderCommentBody(c.body||'');
      var isCreator=c.author&&d.creator_name&&c.author.toLowerCase()===d.creator_name.toLowerCase();
      rightHtml+='<div class="comment-item">'+
        '<div style="display:flex;align-items:center">'+
        '<div class="comment-author">'+escHtml(c.author||'匿名')+
        (isCreator?'<span class="creator-badge">作者</span>':'')+'</div>'+
        (c.likes?'<div class="comment-likes">❤ '+c.likes+'</div>':'')+
        '</div>'+
        '<div class="comment-body">'+bodyHtml+'</div>'+
        '</div>';
    });
    rightHtml+='</div>';
  }
  
  rightEl.innerHTML=rightHtml;
}

function toggleGFDesc(urlName){
  var textEl=document.getElementById('gf-desc-text');
  var btn=event&&event.target;
  if(!textEl)return;
  if(textEl.dataset.expanded==='true'){
    // 重新获取数据
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/api/gf-project-detail-full?name='+encodeURIComponent(urlName),true);
    xhr.onload=function(){
      try{
        var resp=JSON.parse(xhr.responseText);
        var desc=resp.data&&(resp.data.intro_summary||resp.data.description||'');
        if(desc){
          var short=desc.length>200?desc.slice(0,200)+'...':desc;
          textEl.textContent=short;
          if(btn)btn.textContent='展开全文';
          textEl.dataset.expanded='false';
        }
      }catch(e){}
    };
    xhr.send();
  }else{
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/api/gf-project-detail-full?name='+encodeURIComponent(urlName),true);
    xhr.onload=function(){
      try{
        var resp=JSON.parse(xhr.responseText);
        var desc=resp.data&&(resp.data.intro_summary||resp.data.description||'');
        if(desc){
          textEl.textContent=desc;
          if(btn)btn.textContent='收起';
          textEl.dataset.expanded='true';
        }
      }catch(e){}
    };
    xhr.send();
  }
}

function toggleUpdateBody(uid,el){
  var bodyEl=document.getElementById(uid);
  if(!bodyEl)return;
  if(bodyEl.style.display==='none'){
    bodyEl.style.display='block';
    el.classList.add('expanded');
  }else{
    bodyEl.style.display='none';
    el.classList.remove('expanded');
  }
}

function renderUpdateBodyHtml(html){
  if(!html)return escHtml('暂无内容');
  var safe=html.replace(/<\/?[^>]+(>|$)/g,function(m){
    if(/^<(p|br|b|strong|i|em|u|a|ul|ol|li|h[1-6]|div|span|img|blockquote|pre|code|table|tr|td|th|tbody|thead)/i.test(m))return m;
    if(/^<\/(p|br|b|strong|i|em|u|a|ul|ol|li|h[1-6]|div|span|img|blockquote|pre|code|table|tr|td|th|tbody|thead)/i.test(m))return m;
    return '';
  }).replace(/<img /g,'<img style="max-width:100%;border-radius:8px;margin:8px 0" ');
  return safe;
}

function showUpdateDetail(update){
  var modal=document.getElementById('update-detail-modal');
  if(!modal)return;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  
  var headerEl=document.getElementById('ud-header');
  var bodyEl=document.getElementById('ud-body');
  if(headerEl)headerEl.innerHTML='<h3>'+escHtml(update.title||'')+'</h3>';
  if(bodyEl){
    bodyEl.innerHTML=renderUpdateBodyHtml(update.body_html||'');
  }
}

function closeUpdateModal(){
  var modal=document.getElementById('update-detail-modal');
  if(modal)modal.classList.remove('open');
  document.body.style.overflow='';
}

function renderCommentBody(text){
  if(!text)return '';
  // 处理粗体/斜体标记
  var h=escHtml(text);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function stripHtmlSimple(html){
  if(!html)return '';
  return html.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
}

// 点击弹窗外部关闭
document.addEventListener('click',function(e){
  var modal=document.getElementById('gf-detail-modal');
  if(modal&&modal.classList.contains('open')&&e.target===modal)closeGFDetailModal();
  var umodal=document.getElementById('update-detail-modal');
  if(umodal&&umodal.classList.contains('open')&&e.target===umodal)closeUpdateModal();
});

// ESC键关闭
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    closeGFDetailModal();
    closeUpdateModal();
  }
});
